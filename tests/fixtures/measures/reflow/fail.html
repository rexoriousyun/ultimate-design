<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim status</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; margin: 0; padding: 1rem; }
  nav ul { list-style: none; margin: 0 0 1rem; padding: 0; display: flex; gap: 0.5rem; }
  /* The defect: a tab bar that cannot wrap, so at 320px it pushes the page wider than the screen. */
  nav a { white-space: nowrap; }
  nav a {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 1rem;
    color: #14532d; border: 1px solid #14532d; border-radius: 6px; text-decoration: none;
  }
  nav a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  p { line-height: 1.5; color: #333333; overflow-wrap: anywhere; }
  /* A data table keeps its two-dimensional layout and scrolls inside its own container —
     WCAG 1.4.10 exempts it, so the page itself still reflows. */
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #6b6b6b; }
</style>
</head>
<body>
  <header>
    <nav aria-label="Sections">
      <ul>
        <li><a href="#status">Status</a></li>
        <li><a href="#payments">Payments</a></li>
        <li><a href="#documents">Documents</a></li>
        <li><a href="#messages">Messages</a></li>
        <li><a href="#settings">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1 id="status">Claim status</h1>
    <p>Your renewal was received. Reference https://example.org/claims/renewals/2026/reference-0000000000.</p>
    <h2 id="payments">Payments</h2>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Payment history">
      <table>
        <thead><tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Method</th><th scope="col">Status</th></tr></thead>
        <tbody>
          <tr><td>2026-09-01</td><td>£412.00</td><td>Bank transfer</td><td>Paid</td></tr>
          <tr><td>2026-08-01</td><td>£412.00</td><td>Bank transfer</td><td>Paid</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
