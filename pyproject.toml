[project]
name = "ultimate-design"
version = "0.1.0"
description = "Local chat-to-prototype design tool driven by headless Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "mcp>=2.2.0",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
